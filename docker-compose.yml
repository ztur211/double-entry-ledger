services:
  postgres:
    image: postgres:18.4-alpine3.24
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledgerdev
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 1s
      timeout: 3s
      retries: 30
    volumes:
      - ledger-postgres-data:/var/lib/postgresql

volumes:
  ledger-postgres-data: